<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hindi Typing Tutor</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⌨️</text></svg>">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="app-header">
    <h1>Hindi Typing Tutor</h1>
  </header>

  <main class="typing-area">
    <!-- The prompt text the user needs to type -->
    <div class="prompt-display" id="promptDisplay">
      नमस्ते
    </div>

    <div id="wordsCompletedDisplay">Words completed: 0</div>

    <!-- Where the user's typed input will show -->
    <div class="user-input-display" id="userInputDisplay">
      &nbsp;
    </div>
  </main>

  <div class="keyboard-frame">
    <section class="keyboard" id="keyboard">

    <!-- Vowels (स्वर) -->
    <div class="key-row">
      <div class="key">अ</div><div class="key">आ</div><div class="key">इ</div><div class="key">ई</div>
      <div class="key">उ</div><div class="key">ऊ</div><div class="key">ऋ</div><div class="key">ए</div>
      <div class="key">ऐ</div><div class="key">ओ</div><div class="key">औ</div><div class="key">अं</div><div class="key">अः</div>
    </div>

    <!-- Consonants (व्यंजन), grouped in their traditional rows -->
    <div class="key-row">
      <div class="key">क</div><div class="key">ख</div><div class="key">ग</div><div class="key">घ</div><div class="key">ङ</div>
    </div>
    <div class="key-row">
      <div class="key">च</div><div class="key">छ</div><div class="key">ज</div><div class="key">झ</div><div class="key">ञ</div>
    </div>
    <div class="key-row">
      <div class="key">ट</div><div class="key">ठ</div><div class="key">ड</div><div class="key">ढ</div><div class="key">ण</div>
    </div>
    <div class="key-row">
      <div class="key">त</div><div class="key">थ</div><div class="key">द</div><div class="key">ध</div><div class="key">न</div>
    </div>
    <div class="key-row">
      <div class="key">प</div><div class="key">फ</div><div class="key">ब</div><div class="key">भ</div><div class="key">म</div>
    </div>
    <div class="key-row">
      <div class="key">य</div><div class="key">र</div><div class="key">ल</div><div class="key">व</div>
      <div class="key">श</div><div class="key">ष</div><div class="key">स</div><div class="key">ह</div>
    </div>
    <div class="key-row">
      <div class="key">क्ष</div><div class="key">त्र</div><div class="key">ज्ञ</div>
    </div>

    </section>
  </div>

  <script src="script.js"></script>
  <script>
    (() => {
      const progressStorageKey = "hindiTutorProgress";
      let savedProgress = {};
      let sentenceExercises = [];
      let sentencePracticeIndex = 0;
      let sentencePracticeMastered = false;
      let sentenceTypedText = "";
      let sentencePromptStartTime = null;
      let sentenceIsTransitioning = false;
      let sentenceCorrectChars = 0;
      let sentenceTotalMistakes = 0;
      let sentenceTotalCpm = 0;
      let sentenceCompletedWords = 0;

      try {
        const serializedProgress = localStorage.getItem(progressStorageKey);
        if (serializedProgress) {
          const parsedProgress = JSON.parse(serializedProgress);
          if (parsedProgress && typeof parsedProgress === "object" && !Array.isArray(parsedProgress)) {
            savedProgress = parsedProgress;
          }
        }
      } catch {
        savedProgress = {};
      }

      if (savedProgress.activePracticeMode !== "sentences") {
        return;
      }

      const promptDisplay = document.getElementById("promptDisplay");
      const userInputDisplay = document.getElementById("userInputDisplay");
      const wordsCompletedDisplay = document.getElementById("wordsCompletedDisplay");
      const statsDisplay = document.getElementById("statsDisplay");
      const stageDisplay = statsDisplay?.firstElementChild;
      const completionMessage = document.getElementById("completionMessage");
      const lastCpmDisplay = statsDisplay?.children[4];
      const averageCpmDisplay = statsDisplay?.children[5];
      const accuracyDisplay = statsDisplay?.children[6];

      function showSentenceError(message) {
        if (completionMessage) {
          completionMessage.textContent = message;
        }
      }

      function saveSentenceProgress() {
        const progressToSave = {
          ...savedProgress,
          activePracticeMode: "sentences",
          sentencePracticeIndex,
          isSentencePracticeMastered: sentencePracticeMastered,
          wordsCompleted: sentenceCompletedWords
        };
        localStorage.setItem(progressStorageKey, JSON.stringify(progressToSave));
        savedProgress = progressToSave;
      }

      function updateSentenceStats() {
        const exercise = sentenceExercises[sentencePracticeIndex];
        if (!exercise) {
          return;
        }

        stageDisplay.textContent = `Lesson: ${exercise.lessonTitle} — Exercise ${sentencePracticeIndex + 1} of ${sentenceExercises.length}`;
        wordsCompletedDisplay.textContent = `Words completed: ${sentenceCompletedWords}`;
        lastCpmDisplay.textContent = `Last word: ${lastCpmDisplay.dataset.value || 0} CPM`;
        averageCpmDisplay.textContent = `Average: ${sentenceCompletedWords
          ? Math.round(sentenceTotalCpm / sentenceCompletedWords)
          : 0} CPM`;
        const totalAttempts = sentenceCorrectChars + sentenceTotalMistakes;
        const accuracy = totalAttempts === 0
          ? 100
          : Math.round((sentenceCorrectChars / totalAttempts) * 100);
        accuracyDisplay.textContent = `Accuracy: ${accuracy}%`;
      }

      function renderSentenceState() {
        currentPrompt = sentenceExercises[sentencePracticeIndex].text;
        typedText = sentenceTypedText;
        renderPrompt();
        renderTypingState();
        updateSentenceStats();
      }

      function completeSentenceExercise() {
        if (sentenceIsTransitioning) {
          return;
        }

        sentenceIsTransitioning = true;
        const elapsedSeconds = Math.max((Date.now() - sentencePromptStartTime) / 1000, 0.001);
        const currentCpm = Math.round((currentPrompt.length / elapsedSeconds) * 60);
        sentenceCompletedWords += 1;
        sentenceTotalCpm += currentCpm;
        lastCpmDisplay.dataset.value = currentCpm;

        const isLastExercise = sentencePracticeIndex === sentenceExercises.length - 1;
        if (isLastExercise) {
          sentencePracticeMastered = true;
          sentencePracticeIndex = 0;
          completionMessage.textContent = "All sentence exercises complete!";
        } else {
          sentencePracticeIndex += 1;
          completionMessage.textContent = "Completed!";
        }

        saveSentenceProgress();
        updateSentenceStats();

        setTimeout(() => {
          sentenceTypedText = "";
          sentencePromptStartTime = null;
          renderSentenceState();
          sentenceIsTransitioning = false;
        }, 800);
      }

      function addSentenceCharacter(character) {
        if (sentenceIsTransitioning) {
          return;
        }

        if (sentenceTypedText.length === 0 && sentencePromptStartTime === null) {
          sentencePromptStartTime = Date.now();
        }

        const expectedCharacter = currentPrompt[sentenceTypedText.length];
        if (character === expectedCharacter) {
          sentenceCorrectChars += 1;
        } else {
          sentenceTotalMistakes += 1;
        }

        sentenceTypedText += character;
        renderSentenceState();
        if (sentenceTypedText === currentPrompt) {
          completeSentenceExercise();
        }
      }

      function removeSentenceCharacter() {
        if (sentenceIsTransitioning) {
          return;
        }

        sentenceTypedText = sentenceTypedText.slice(0, -1);
        renderSentenceState();
      }

      function handleSentenceClick(event) {
        if (event.target.closest(".key-spacebar")) {
          event.stopImmediatePropagation();
          addSentenceCharacter(" ");
          return;
        }

        const keyElement = event.target.closest(".inscript-key");
        if (!keyElement) {
          return;
        }

        event.stopImmediatePropagation();
        const keyMapping = INSCRIPT_LAYOUT[keyElement.dataset.code];
        const character = event.shiftKey || keyElement.classList.contains("shift-active")
          ? keyMapping.shifted
          : keyMapping.unshifted;
        if (character !== null) {
          addSentenceCharacter(character);
        }
      }

      function handleSentenceKeydown(event) {
        if (event.ctrlKey || event.altKey || event.metaKey) {
          return;
        }

        if (event.key === " ") {
          event.preventDefault();
          event.stopImmediatePropagation();
          addSentenceCharacter(" ");
          return;
        }

        if (event.key === "Backspace") {
          event.preventDefault();
          event.stopImmediatePropagation();
          removeSentenceCharacter();
          return;
        }

        const keyMapping = INSCRIPT_LAYOUT[event.code];
        if (!keyMapping) {
          return;
        }

        event.preventDefault();
        event.stopImmediatePropagation();
        const character = event.shiftKey ? keyMapping.shifted : keyMapping.unshifted;
        if (character !== null) {
          addSentenceCharacter(character);
        }
      }

      document.addEventListener("click", handleSentenceClick, true);
      document.addEventListener("keydown", handleSentenceKeydown, true);

      fetch("/content/lessons.json")
        .then((response) => {
          if (!response.ok) {
            throw new Error(`Lesson content request failed with status ${response.status}.`);
          }
          return response.json();
        })
        .then((content) => {
          if (!content || !Array.isArray(content.lessons)) {
            throw new Error("Lesson content has an invalid format.");
          }

          sentenceExercises = content.lessons.flatMap((lesson) => (
            Array.isArray(lesson.levels)
              ? lesson.levels.flatMap((level) => (
                Array.isArray(level.exercises)
                  ? level.exercises.map((exercise) => ({
                    ...exercise,
                    lessonTitle: lesson.title
                  }))
                  : []
              ))
              : []
          ));

          if (sentenceExercises.length === 0) {
            throw new Error("No sentence exercises are available.");
          }

          sentencePracticeIndex = Number.isInteger(savedProgress.sentencePracticeIndex)
            && savedProgress.sentencePracticeIndex >= 0
            && savedProgress.sentencePracticeIndex < sentenceExercises.length
            ? savedProgress.sentencePracticeIndex
            : 0;
          sentencePracticeMastered = savedProgress.isSentencePracticeMastered === true;
          sentenceCompletedWords = Number.isInteger(savedProgress.wordsCompleted)
            && savedProgress.wordsCompleted >= 0
            ? savedProgress.wordsCompleted
            : 0;
          renderSentenceState();
        })
        .catch((error) => {
          showSentenceError(`Unable to load sentence practice: ${error.message}`);
        });
    })();
  </script>
</body>
</html>
